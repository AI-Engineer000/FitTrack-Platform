{% load static socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/typography.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — FitTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dashboard.css' %}">
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="auth-brand">
        <span class="brand-dot"></span>
        <span>Fit<em>Track</em></span>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Login to manage your athletes</p>

    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <button type="button" class="google-btn" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
    </button>

    <div class="divider">or</div>

    <form method="POST" class="auth-form">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required autofocus>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="auth-btn">Login</button>
    </form>

    <p class="auth-footer">
        Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
    </p>
</div>

<script>
    function googleLogin() {
        const googleUrl = "{% provider_login_url 'google' %}";
        const width = 500;
        const height = 600;
        const left = (window.screen.width / 2) - (width / 2);
        const top = (window.screen.height / 2) - (height / 2);

        const popup = window.open(
            googleUrl,
            'Google Login',
            `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
        );

        if (!popup) {
            window.location.href = googleUrl;
            return;
        }

        const timer = setInterval(() => {
            if (!popup || popup.closed) {
                clearInterval(timer);
                window.location.href = '/trainer/dashboard/';
            }
        }, 500);
    }
</script>

</body>
</html>
