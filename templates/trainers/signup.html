{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/typography.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — FitTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'dashboard.css' %}">
<style>
    .password-field { position: relative; }
    .password-field input { width: 100%; padding-right: 3.25rem; }
    .password-toggle {
        position: absolute; top: 50%; right: 12px; display: grid; place-items: center;
        width: 32px; height: 32px; padding: 0; border: 0; border-radius: 6px;
        background: transparent; color: #78827c; cursor: pointer; transform: translateY(-50%);
    }
    .password-toggle:hover { color: #1f6b48; }
    .password-toggle:focus-visible { outline: 2px solid #1f6b48; }
</style>
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="auth-brand">
        <span class="brand-dot"></span>
        <span>Fit<em>Track</em></span>
    </div>

    <h1 class="auth-title">Create Trainer Account</h1>
    <p class="auth-sub">Manage your athletes from one dashboard</p>

    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="auth-form">
        {% csrf_token %}

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" required>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Organization (optional)</label>
            <input type="text" name="organization">
        </div>

        <div class="form-group">
            <label>Phone (optional)</label>
            <input type="text" name="phone">
        </div>

        <div class="form-group password-field">
            <label>Password</label>
            <input type="password" name="password1" required>
            <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">👁️</button>
        </div>

        <div class="form-group password-field">
            <label>Confirm Password</label>
            <input type="password" name="password2" required>
            <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">👁️</button>
        </div>

        <button type="submit" class="auth-btn">Create Account</button>
    </form>

    <p class="auth-footer">
        Already have an account? <a href="{% url 'login' %}">Login</a>
    </p>
</div>

<script>
    document.querySelectorAll("[data-password-toggle]").forEach(function (button) {
        button.addEventListener("click", function () {
            const input = button.parentElement.querySelector("input");
            const showPassword = input.type === "password";
            input.type = showPassword ? "text" : "password";
            button.textContent = showPassword ? "🙈" : "👁️";
            button.setAttribute("aria-label", showPassword ? "Hide password" : "Show password");
            button.setAttribute("aria-pressed", String(showPassword));
        });
    });
</script>

</body>
</html>
