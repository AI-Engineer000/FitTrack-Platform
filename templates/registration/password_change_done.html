<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Updated — FitTrack</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 48px 20px; background: #f4f6fa; color: #14243a; font: 15px/1.5 Arial, sans-serif; }
        main { width: min(100%, 520px); margin: 0 auto; padding: 36px; border: 1px solid #e1e6ef; border-radius: 18px; background: #fff; text-align: center; box-shadow: 0 12px 32px rgba(20, 36, 58, .08); }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { margin-bottom: 24px; color: #64748b; }
        a { display: inline-block; padding: 11px 16px; border-radius: 9px; background: #10b981; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>Password updated</h1>
        <p>Your password has been changed successfully.</p>
        <a href="{% url 'accounts:profile_edit' %}">Back to Profile</a>
    </main>
</body>
</html>
