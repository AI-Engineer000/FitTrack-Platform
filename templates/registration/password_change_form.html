<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password — FitTrack</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 48px 20px; background: #f4f6fa; color: #14243a; font: 15px/1.5 Arial, sans-serif; }
        main { width: min(100%, 520px); margin: 0 auto; padding: 32px; border: 1px solid #e1e6ef; border-radius: 18px; background: #fff; box-shadow: 0 12px 32px rgba(20, 36, 58, .08); }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { color: #64748b; }
        label { display: block; margin: 18px 0 7px; font-weight: 700; }
        input { width: 100%; padding: 12px; border: 1px solid #d5dce6; border-radius: 9px; font: inherit; }
        input:focus { outline: 3px solid rgba(16, 185, 129, .18); border-color: #10b981; }
        .password-field { position: relative; }
        .password-field input { padding-right: 48px; }
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            transform: translateY(-50%);
        }
        .password-toggle:hover { color: #10b981; }
        .password-toggle:focus-visible { outline: 2px solid #10b981; }
        ul.errorlist { color: #b42318; padding-left: 20px; }
        .helptext { display: block; margin-top: 6px; color: #64748b; font-size: 13px; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
        .button { display: inline-block; padding: 11px 16px; border: 0; border-radius: 9px; background: #10b981; color: #fff; font-weight: 700; text-decoration: none; cursor: pointer; }
        .button.secondary { border: 1px solid #d5dce6; background: #fff; color: #14243a; }
    </style>
</head>
<body>
    <main>
        <h1>Change Password</h1>
        <p>Choose a new password for your FitTrack account.</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <p>
                    {{ field.label_tag }}
                    <span class="password-field">
                        {{ field }}
                        <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">👁️</button>
                    </span>
                    {% if field.help_text %}<span class="helptext">{{ field.help_text|safe }}</span>{% endif %}
                    {{ field.errors }}
                </p>
            {% endfor %}
            <div class="actions">
                <button class="button" type="submit">Update Password</button>
                <a class="button secondary" href="{% url 'accounts:profile_edit' %}">Back to Profile</a>
            </div>
        </form>
    </main>
    <script>
        document.querySelectorAll("[data-password-toggle]").forEach(function (button) {
            button.addEventListener("click", function () {
                const input = button.parentElement.querySelector("input");
                const showPassword = input.type === "password";
                input.type = showPassword ? "text" : "password";
                button.textContent = showPassword ? "🙈" : "👁️";
                button.setAttribute("aria-label", showPassword ? "Hide password" : "Show password");
                button.setAttribute("aria-pressed", String(showPassword));
            });
        });
    </script>
</body>
</html>
