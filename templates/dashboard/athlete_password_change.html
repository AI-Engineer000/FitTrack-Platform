<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101820">
    <title>Change Password — FitTrack</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #eef4f3; background: #101820; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background: radial-gradient(ellipse at 85% 0%, rgba(16, 185, 129, .12), transparent 34rem), #101820;
        }
        main {
            width: min(100%, 560px);
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #2b3a43;
            border-radius: 15px;
            background: #19242d;
            box-shadow: 0 16px 42px rgba(0, 0, 0, .2);
        }
        .eyebrow { margin: 0 0 8px; color: #6ee7b7; font-size: .73rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: -.03em; }
        .intro { margin: 8px 0 24px; color: #9eadae; line-height: 1.6; }
        form p { margin: 0 0 18px; }
        label { display: block; margin-bottom: 7px; color: #e4ecea; font-size: .86rem; font-weight: 650; }
        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #394a53;
            border-radius: 8px;
            outline: 0;
            background: #111b22;
            color: #f5faf9;
            font: inherit;
        }
        input:focus { border-color: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, .15); }
        .password-field { position: relative; }
        .password-field input { padding-right: 48px; }
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #9eadae;
            cursor: pointer;
            transform: translateY(-50%);
        }
        .password-toggle:hover { color: #6ee7b7; }
        .password-toggle:focus-visible { outline: 2px solid #6ee7b7; }
        .helptext { display: block; margin-top: 7px; color: #9eadae; font-size: .78rem; line-height: 1.5; }
        .helptext ul { margin: 6px 0 0; padding-left: 18px; }
        .errorlist { margin: 6px 0; padding-left: 18px; color: #fca5a5; font-size: .82rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 10px 15px;
            border: 1px solid #34d399;
            border-radius: 8px;
            background: #10b981;
            color: #06251d;
            font: inherit;
            font-size: .88rem;
            font-weight: 750;
            text-decoration: none;
            cursor: pointer;
        }
        .button.secondary { border-color: #394a53; background: transparent; color: #d3dddb; }
        @media (max-width: 480px) { main { padding: 24px 19px; } }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Athlete Account</p>
        <h1>Change Password</h1>
        <p class="intro">Choose a new password to keep your athlete account secure.</p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <p>
                    {{ field.label_tag }}
                    <span class="password-field">
                        {{ field }}
                        <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" aria-pressed="false">👁️</button>
                    </span>
                    {% if field.help_text %}<span class="helptext">{{ field.help_text|safe }}</span>{% endif %}
                    {{ field.errors }}
                </p>
            {% endfor %}
            <div class="actions">
                <button class="button" type="submit">Update Password</button>
                <a class="button secondary" href="{% url 'dashboard:athlete_dashboard' %}">Back to Dashboard</a>
            </div>
        </form>
    </main>
    <script>
        document.querySelectorAll("[data-password-toggle]").forEach(function (button) {
            button.addEventListener("click", function () {
                const input = button.parentElement.querySelector("input");
                const showPassword = input.type === "password";
                input.type = showPassword ? "text" : "password";
                button.textContent = showPassword ? "🙈" : "👁️";
                button.setAttribute("aria-label", showPassword ? "Hide password" : "Show password");
                button.setAttribute("aria-pressed", String(showPassword));
            });
        });
    </script>
</body>
</html>
